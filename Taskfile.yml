version: '3'

# Machine-local signing configuration. A missing file is not an error: the vars
# below then fall back to ad-hoc signing. See .env.example.
dotenv: ['.env.local']

vars:
  PROJECT: MonitorControl.xcodeproj
  SCHEME: MonitorControl
  APP_NAME: MonitorControl.app
  BUNDLE_ID: app.monitorcontrol.MonitorControl
  INSTALL_DIR: /Applications
  # No -derivedDataPath: Xcode's own DerivedData location is used, which keeps
  # build output out of the working tree and shares it with Xcode.app. Products
  # inside the project directory make upstream's "Increase Build Number" phase
  # fire on every build, because it bumps CFBundleVersion whenever it finds a
  # file newer than Info.plist anywhere under PROJECT_DIR. The path is therefore
  # not predictable and has to be asked for; PRODUCTS_DIR does that.
  SHOW_BUILD_SETTINGS: xcodebuild -project MonitorControl.xcodeproj -scheme MonitorControl -showBuildSettings
  # Upstream ships DEVELOPMENT_TEAM = 299YSU96J7, which this machine cannot sign
  # with. Overriding on the command line keeps project.pbxproj identical to
  # upstream, so it merges cleanly. "-" is ad-hoc signing, the fallback when
  # .env.local says nothing.
  SIGN_IDENTITY: '{{.MC_CODE_SIGN_IDENTITY | default "-"}}'
  SIGN_TEAM: '{{.MC_DEVELOPMENT_TEAM | default ""}}'
  SIGN_ARGS: >-
    CODE_SIGN_STYLE=Manual
    DEVELOPMENT_TEAM={{.SIGN_TEAM}}
    CODE_SIGN_IDENTITY="{{.SIGN_IDENTITY}}"
    PROVISIONING_PROFILE_SPECIFIER=
  # Upstream targets macOS 10.14 (10.15 for the helper), which Xcode 26 and later
  # refuse to build: their SDKs only go down to 12.0. Overriding on the command
  # line keeps project.pbxproj identical to upstream. The app is only ever run on
  # this machine, and every version check in the code is a runtime #available, so
  # raising the floor changes nothing but what the linker accepts.
  BUILD_ARGS: MACOSX_DEPLOYMENT_TARGET={{.MC_DEPLOYMENT_TARGET | default "12.0"}}

tasks:
  default:
    cmds:
      - task --list
    silent: true

  signing:
    desc: Show the code signing identity the build tasks will use
    cmds:
      - cmd: |
          echo "identity: {{.SIGN_IDENTITY}}"
          echo "team:     {{.SIGN_TEAM}}"
          test -f .env.local && echo "source:   .env.local" || echo "source:   built-in fallback (ad-hoc)"
        silent: true

  deps:
    desc: Resolve the Swift Package Manager dependencies
    cmds:
      - xcodebuild -project {{.PROJECT}} -resolve-package-dependencies

  build:
    desc: Build the Debug configuration
    cmds:
      - task: xcodebuild
        vars: { CONFIGURATION: Debug }

  build:release:
    desc: Build the Release configuration
    cmds:
      - task: xcodebuild
        vars: { CONFIGURATION: Release }

  xcodebuild:
    internal: true
    requires:
      vars: [CONFIGURATION]
    vars:
      PRODUCTS_DIR:
        sh: '{{.SHOW_BUILD_SETTINGS}} -configuration {{.CONFIGURATION}} | awk -F'' = '' ''/ BUILT_PRODUCTS_DIR = /{print $2; exit}'''
    cmds:
      - >-
        xcodebuild
        -project {{.PROJECT}}
        -scheme {{.SCHEME}}
        -configuration {{.CONFIGURATION}}
        {{.SIGN_ARGS}}
        {{.BUILD_ARGS}}
        build
      - cmd: echo "Built {{.CONFIGURATION}}:{{"\t"}}{{.PRODUCTS_DIR}}/{{.APP_NAME}}"
        silent: true

  run:
    desc: Build and launch the Debug build in place
    deps: [build]
    vars:
      PRODUCTS_DIR:
        sh: '{{.SHOW_BUILD_SETTINGS}} -configuration Debug | awk -F'' = '' ''/ BUILT_PRODUCTS_DIR = /{print $2; exit}'''
    cmds:
      - task: quit
      - open "{{.PRODUCTS_DIR}}/{{.APP_NAME}}"

  install:
    desc: Replace the app in /Applications with a local Release build
    prompt: Replace {{.INSTALL_DIR}}/{{.APP_NAME}} with the local Release build?
    deps: [build:release]
    vars:
      PRODUCTS_DIR:
        sh: '{{.SHOW_BUILD_SETTINGS}} -configuration Release | awk -F'' = '' ''/ BUILT_PRODUCTS_DIR = /{print $2; exit}'''
    cmds:
      - task: quit
      - rm -rf "{{.INSTALL_DIR}}/{{.APP_NAME}}"
      - ditto "{{.PRODUCTS_DIR}}/{{.APP_NAME}}" "{{.INSTALL_DIR}}/{{.APP_NAME}}"
      # Sparkle would otherwise offer to "update" this fork back to the official build.
      - defaults write {{.BUNDLE_ID}} SUEnableAutomaticChecks -bool false
      - cmd: |
          echo 'Installed. Ad-hoc signing changes the code signature, so macOS treats'
          echo 'this as a new app: re-grant Accessibility permission and remove the'
          echo 'stale entry in System Settings -> Privacy & Security -> Accessibility.'
        silent: true

  quit:
    desc: Quit a running MonitorControl
    cmds:
      - cmd: pkill -x MonitorControl
        ignore_error: true

  clean:
    desc: Remove the build products of both configurations
    cmds:
      - xcodebuild -project {{.PROJECT}} -scheme {{.SCHEME}} -configuration Debug clean
      - xcodebuild -project {{.PROJECT}} -scheme {{.SCHEME}} -configuration Release clean

  format:
    desc: Run SwiftFormat over the given paths (never the whole tree)
    summary: |
      Formats only the paths passed after --, e.g.

        task format -- MonitorControl/Model/OtherDisplay.swift

      Formatting the whole tree is deliberately not offered. It is harmless
      while mise.toml's pinned SwiftFormat reproduces upstream's committed
      formatting, but a version that does not would bury this fork's own
      changes. See CLAUDE.md.
    preconditions:
      # requires.vars does not catch an empty CLI_ARGS, so check it here.
      - sh: test -n "{{.CLI_ARGS}}"
        msg: pass the files to format after --, e.g. task format -- MonitorControl/Model/OtherDisplay.swift
      - sh: command -v swiftformat
        msg: swiftformat is not on PATH, run mise install (mise.toml pins the version)
    cmds:
      - swiftformat {{.CLI_ARGS}}

  lint:
    desc: Run SwiftLint
    preconditions:
      - sh: command -v swiftlint
        msg: swiftlint is not installed (brew install swiftlint)
    cmds:
      - swiftlint
